<aside id="sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen pt-16 hover:bg-[#DEA6A1] border-r border-gray-200 shadow-sm transition-transform -translate-x-full sm:translate-x-0">
    <div class="flex flex-col h-full px-3 py-4 overflow-y-auto bg-white mr-2">

        <!-- Logo -->
        <div class="flex items-center gap-3 px-3 mb-6 mt-1">
            <div class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg shadow">
            </div>
            <span class="text-base font-bold text-[#F9F0EF]">COBOL</span>
        </div>

        <!-- Gender Section -->
        <p class="px-3 mb-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">Gender</p>
        <ul class="space-y-1 mb-4">
            <li>
               <a href="{% url 'gender_list' %}"
                   style="display:block; padding:10px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:500;"
                   onmouseover="this.style.background='#EFF6FF'; this.style.color='#1D4ED8';"
                   onmouseout="this.style.background=''; this.style.color='#374151';">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                        </svg>
                        Gender List
                    </span>
                </a>
            </li>
            <li>
                <a href="{% url 'add_gender' %}"
                   style="display:block; padding:10px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:500;"
                   onmouseover="this.style.background='#EFF6FF'; this.style.color='#1D4ED8';"
                   onmouseout="this.style.background=''; this.style.color='#374151';">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Gender
                    </span>
                </a>
            </li>
        </ul>

        <!-- User Section -->
        <p class="px-3 mb-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">User</p>
        <ul class="space-y-1">
            <li>
                <a href="{% url 'user_list' %}"
                   style="display:block; padding:10px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:500;"
                   onmouseover="this.style.background='#EFF6FF'; this.style.color='#1D4ED8';"
                   onmouseout="this.style.background=''; this.style.color='#374151';">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
                        </svg>
                        User List
                    </span>
                </a>
            </li>
            <li>
                <a href="{% url 'add_user' %}"
                   style="display:block; padding:10px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:500;"
                   onmouseover="this.style.background='#EFF6FF'; this.style.color='#1D4ED8';"
                   onmouseout="this.style.background=''; this.style.color='#374151';">
                    <span style="display:flex; align-items:center; gap:8px;">
                        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                        Add User
                    </span>
                </a>
            </li>
        </ul>
    </div>
</aside>

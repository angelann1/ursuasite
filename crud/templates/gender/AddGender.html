{% extends "layout/base.html" %}
{% block title %}Add Gender{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-100 mt-14">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Gender</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="gender" class="block mb-2 text-sm font-medium text-gray-700">Gender Name</label>
                <input type="text" id="gender" name="gender" oninput="this.value = this.value.replace(/[0-9]/g, '')"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 outline-none transition"
                required>
        </div>
        <div class="flex justify-between items-center">
            <a href="/gender/list" class="text-sm text-gray-500 hover:underline">← Back to list</a>
            <button type="submit"
                class="text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none shadow-sm transition">
                Save Gender
            </button>
        </div>
    </form>
</div>
{% endblock %}

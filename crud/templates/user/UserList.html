{% extends 'layout/base.html' %}

{% block title %}Users List{% endblock %}

{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
  <h2 style="font-size:18px; font-weight:600; color:#ec4899;">Users List</h2>
  
  <div style="display:flex; align-items:center; gap:10px;">
    <input type="text" id="searchInput" onkeyup="searchUsers()" 
      placeholder="Search users..."
      style="padding:8px 14px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; outline:none; width:220px;"
      onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
    <a href="{% url 'add_user' %}"
      style="background:linear-gradient(to right, #f472b6, #a855f7); color:#fff; padding:8px 16px; border-radius:6px; text-decoration:none; font-size:13px; font-weight:500; white-space:nowrap; transition: opacity 0.2s;"
      onmouseover="this.style.opacity='0.85'"
      onmouseout="this.style.opacity='1'">
      + Add User
    </a>
  </div>
</div>

<style>
  .photo-zoom {
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  .photo-zoom:hover {
    transform: scale(1.8);
    z-index: 99;
    position: relative;
    border-color: #ec4899 !important;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
  }
  .avatar-zoom {
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  .avatar-zoom:hover {
    transform: scale(1.8);
    z-index: 99;
    position: relative;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
  }
  .btn-edit {
    background:#22c55e; color:#fff; padding:6px 14px; border-radius:5px;
    text-decoration:none; font-size:12px; font-weight:500; margin-right:4px;
    display:inline-block; transition: background 0.2s, transform 0.1s;
  }
  .btn-edit:hover {
    background:#16a34a;
    transform: scale(1.05);
  }
  .btn-delete {
    background:#ef4444; color:#fff; padding:6px 14px; border-radius:5px;
    text-decoration:none; font-size:12px; font-weight:500;
    display:inline-block; transition: background 0.2s, transform 0.1s;
  }
  .btn-delete:hover {
    background:#dc2626;
    transform: scale(1.05);
  }
</style>

<div style="overflow-x:auto;">
<table style="width:100%; border-collapse:collapse; font-size:13px; min-width:900px;">
  <thead>
    <tr style="background:linear-gradient(to right, #f472b6, #a855f7); color:#fff;">
      <th style="padding:12px 16px; text-align:left; font-weight:600;">User ID</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Photo</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Full Name</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Gender</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Birth Date</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Address</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Contact Number</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Email</th>
      <th style="padding:12px 16px; text-align:left; font-weight:600;">Username</th>
      <th style="padding:12px 16px; text-align:center; font-weight:600;">Action</th>
    </tr>
  </thead>
  <tbody id="userTableBody">
    <!-- Rows loaded by JS -->
  </tbody>
</table>
</div>

<!-- Loading spinner -->
<div id="loadingSpinner" style="text-align:center; padding:16px; display:none;">
  <span style="font-size:13px; color:#f9a8d4;">Loading more users...</span>
</div>

<!-- No results -->
<div id="noResults" style="text-align:center; padding:24px; color:#f9a8d4; display:none;">
  No users found.
</div>

<script>
  const allUsers = [
    {% for user in users %}
    {
      counter: {{ forloop.counter }},
      user_id: {{ user.user_id }},
      profile_picture: "{% if user.profile_picture and user.profile_picture.name %}{{ user.profile_picture.url|escapejs }}{% endif %}",
      full_name: "{{ user.full_name|escapejs }}",
      gender: "{{ user.gender.gender|escapejs }}",
      birth_date: "{{ user.birth_date|date:'F j, Y' }}",
      address: "{{ user.address|escapejs }}",
      contact_number: "{{ user.contact_number|escapejs }}",
      email: "{{ user.email|default:'—'|escapejs }}",
      username: "{{ user.username|escapejs }}",
    },
    {% endfor %}
  ];

  const BATCH = 15;
  let loaded = 0;
  let filtered = [...allUsers];

  function renderRows(data) {
    const tbody = document.getElementById('userTableBody');
    const chunk = data.slice(loaded, loaded + BATCH);
    chunk.forEach(user => {
      const tr = document.createElement('tr');
      tr.style.cssText = 'border-bottom:1px solid #fce7f3; background:#fff; transition: background 0.2s;';
      tr.onmouseover = function() { this.style.background = '#fdf2f8'; };
      tr.onmouseout = function() { this.style.background = '#fff'; };
      tr.innerHTML = `
        <td style="padding:12px 16px; color:#374151;">${user.counter}</td>
        <td style="padding:12px 16px; vertical-align:middle;">
          ${user.profile_picture
          ? `<img src="${user.profile_picture}" class="photo-zoom" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #f9a8d4;">`
          : `<div style="width:36px; height:36px; border-radius:50%; background:#fce7f3; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#ec4899;">${user.full_name.charAt(0)}</div>`}
      </div>
        <td style="padding:12px 16px; color:#374151;">${user.full_name}</td>
        <td style="padding:12px 16px; color:#374151;">${user.gender}</td>
        <td style="padding:12px 16px; color:#374151;">${user.birth_date}</td>
        <td style="padding:12px 16px; color:#374151;">${user.address}</td>
        <td style="padding:12px 16px; color:#374151;">${user.contact_number}</td>
        <td style="padding:12px 16px; color:#374151;">${user.email}</td>
        <td style="padding:12px 16px; color:#374151;">${user.username}</td>
        <td style="padding:12px 16px; text-align:center; white-space:nowrap;">
          <a href="/user/edit/${user.user_id}" class="btn-edit">Edit</a>
          <a href="/user/delete/${user.user_id}" class="btn-delete">Delete</a>
        </td>
      `;
      tbody.appendChild(tr);
    });
    loaded += chunk.length;
    document.getElementById('noResults').style.display =
      filtered.length === 0 ? 'block' : 'none';
  }

  renderRows(filtered);

  const sentinel = document.createElement('div');
  sentinel.style.height = '1px';
  document.body.appendChild(sentinel);

  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && loaded < filtered.length) {
      const spinner = document.getElementById('loadingSpinner');
      spinner.style.display = 'block';
      setTimeout(() => {
        renderRows(filtered);
        spinner.style.display = 'none';
      }, 2000);
    }
  }, { rootMargin: '100px' });

  observer.observe(sentinel);

  function searchUsers() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    filtered = allUsers.filter(u =>
      `${u.full_name} ${u.gender} ${u.birth_date} ${u.address} ${u.contact_number} ${u.email} ${u.username}`
        .toLowerCase().includes(input)
    );
    document.getElementById('userTableBody').innerHTML = '';
    loaded = 0;
    renderRows(filtered);
  }
</script>

{% endblock %}

{% extends 'layout/base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
{% include 'include/ToastMessage.html' %}

<div style="padding: 30px 40px;">

  <form method="POST" action="/user/edit/{{ user.user_id }}">
    {% csrf_token %}

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px 40px;">

      <!-- Full Name -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Full Name</label>
        <input type="text" name="full_name" value="{{ user.full_name }}" required
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Email -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Email</label>
        <input type="email" name="email" value="{{ user.email }}"
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Gender -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Gender</label>
        <div style="position:relative;">
          <select name="gender" required
            style="width:100%; padding:9px 36px 9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; background:#fff; appearance:none; -webkit-appearance:none; box-sizing:border-box; outline:none; cursor:pointer;"
            onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'">
            <option value="" disabled>Select Gender</option>
            {% for g in genders %}
              <option value="{{ g.gender_id }}" {% if g.gender_id == user.gender.gender_id %}selected{% endif %}>
                {{ g.gender }}
              </option>
            {% endfor %}
          </select>
          <span style="position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:#6b7280;">
            <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Username -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Username</label>
        <input type="text" name="username" value="{{ user.username }}" required
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Birth Date -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Birth Date</label>
        <input type="date" name="birth_date" value="{{ user.birth_date|date:'Y-m-d' }}" required
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- New Password (optional) -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">
          New Password <span style="color:#9ca3af; font-weight:400;">(leave blank to keep current)</span>
        </label>
        <input type="password" name="password" id="password"
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Address -->
      <div style="grid-column: span 2;">
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Address</label>
        <input type="text" name="address" value="{{ user.address }}" required
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Contact Number -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Contact Number</label>
        <input type="text" name="contact_number" value="{{ user.contact_number }}" required
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

      <!-- Confirm Password -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirm_password"
          style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#d1d5db'" />
      </div>

    </div>

    <!-- Buttons -->
    <div style="margin-top:28px; display:flex; gap:10px;">
      <button type="submit"
        style="background:#2563eb; color:#fff; padding:9px 24px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;">
        Update User
      </button>
      <a href="/user/list"
        style="background:#e5e7eb; color:#374151; padding:9px 24px; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none;">
        Cancel
      </a>
    </div>

  </form>
</div>

<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    if (pw && pw !== cpw) {
      e.preventDefault();
      alert('Passwords do not match!');
    }
  });
</script>
{% endblock %}

{% extends 'layout/base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}

<div style="padding: 30px 40px;">

  <form method="post" action="{% url 'add_user' %}" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Profile Picture - Centered at top (same as EditUser) -->
    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:28px;">
      <div id="avatarPlaceholder" style="width:96px; height:96px; border-radius:50%; background:#fce7f3; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; color:#ec4899;">
        👤
      </div>
      <img id="avatarPreview" style="display:none; width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid #f9a8d4;">

      <label style="margin-top:10px; font-size:13px; font-weight:500; color:#ec4899;">
        Profile Picture <span style="color:#9ca3af; font-weight:400;">(optional)</span>
      </label>

      <!-- Custom File Button -->
      <label for="profile_picture"
        style="margin-top:8px; cursor:pointer; background:linear-gradient(to right, #f472b6, #a855f7); color:#fff; padding:8px 20px; border-radius:20px; font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition: opacity 0.2s;"
        onmouseover="this.style.opacity='0.85'"
        onmouseout="this.style.opacity='1'">
        Choose Photo
      </label>
      <input type="file" name="profile_picture" id="profile_picture" accept="image/*" style="display:none;" />
      <p id="fileName" style="font-size:12px; color:#9ca3af; margin-top:4px;">No file chosen</p>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px 40px;">

      <!-- Full Name -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Full Name</label>
        <input type="text" name="full_name" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Email -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Email</label>
        <input type="email" name="email" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Gender -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Gender</label>
        <div style="position:relative;">
          <select name="gender" required
            style="width:100%; padding:9px 36px 9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; background:#fff; appearance:none; -webkit-appearance:none; box-sizing:border-box; outline:none; cursor:pointer;"
            onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'">
            <option value="" disabled selected>Select Gender</option>
            {% for g in genders %}
              <option value="{{ g.gender_id }}">{{ g.gender }}</option>
            {% endfor %}
          </select>
          <span style="position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:#ec4899;">
            <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Username -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Username</label>
        <input type="text" name="username" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Birth Date -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Birth Date</label>
        <input type="date" name="birth_date" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Password -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Password</label>
        <input type="password" name="password" id="password" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Contact Number -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Contact Number</label>
        <input type="text" name="contact_number" required maxlength="11" pattern="[0-9]*"
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'"
          oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
      </div>

      <!-- Confirm Password -->
      <div>
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

      <!-- Address full width at bottom -->
      <div style="grid-column: span 2;">
        <label style="display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px;">Address</label>
        <input type="text" name="address" required
          style="width:100%; padding:9px 12px; border:1px solid #f9a8d4; border-radius:6px; font-size:13px; color:#111; box-sizing:border-box; outline:none;"
          onfocus="this.style.borderColor='#ec4899'" onblur="this.style.borderColor='#f9a8d4'" />
      </div>

    </div>

     <!-- Buttons -->
  <div style="margin-top:28px; display:flex; gap:10px;">
    <button type="submit"
      style="background:#ec4899; color:#fff; padding:9px 24px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition: background 0.2s;"
      onmouseover="this.style.background='#db2777'"
      onmouseout="this.style.background='#ec4899'">
      Save User
    </button>
    <a href="{% url 'user_list' %}"
      style="background:#e5e7eb; color:#374151; padding:9px 24px; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none; transition: background 0.2s;"
      onmouseover="this.style.background='#d1d5db'; this.style.color='#111827';"
      onmouseout="this.style.background='#e5e7eb'; this.style.color='#374151';">
      Cancel
    </a>
  </div>


  </form>
</div>

<script>
  // Show selected filename
  document.getElementById('profile_picture').addEventListener('change', function () {
    const file = this.files[0];
    const fileNameEl = document.getElementById('fileName');
    if (!file) return;
    fileNameEl.textContent = '📎 ' + file.name;
    fileNameEl.style.color = '#ec4899';

    const reader = new FileReader();
    reader.onload = function (e) {
      const preview     = document.getElementById('avatarPreview');
      const placeholder = document.getElementById('avatarPlaceholder');
      preview.src           = e.target.result;
      preview.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  // Username check
  const usernameInput = document.querySelector('input[name="username"]');
  let usernameMsg = document.createElement('p');
  usernameMsg.style.cssText = 'font-size:12px; margin-top:4px;';
  usernameInput.parentNode.appendChild(usernameMsg);

  usernameInput.addEventListener('blur', function () {
    const val = this.value.trim();
    if (!val) return;
    fetch(`/user/check-username?username=${encodeURIComponent(val)}`)
      .then(res => res.json())
      .then(data => {
        if (data.exists) {
          usernameMsg.textContent = '⚠️ Username already exists!';
          usernameMsg.style.color = '#dc2626';
          usernameInput.style.borderColor = '#dc2626';
        } else {
          usernameMsg.textContent = '✓ Username is available';
          usernameMsg.style.color = '#16a34a';
          usernameInput.style.borderColor = '#16a34a';
        }
      });
  });

  usernameInput.addEventListener('input', function () {
    usernameMsg.textContent = '';
    usernameInput.style.borderColor = '#f9a8d4';
  });


  const emailInput = document.querySelector('input[name="email"]');

  // 1. Prevent duplicate message elements if the script re-runs
  let emailMsg = emailInput.parentNode.querySelector('.email-validation-msg');
  if (!emailMsg) {
    emailMsg = document.createElement('p');
    emailMsg.className = 'email-validation-msg';
    emailMsg.style.cssText = 'font-size:12px; margin-top:4px; min-height: 1em;';
    emailInput.parentNode.appendChild(emailMsg);
  }

// 2. Track the latest request to prevent "race conditions"
  let currentFetchController = null;

  emailInput.addEventListener('blur', function () {
    const val = this.value.trim();
    if (!val) return;

  // Cancel any pending request before starting a new one
    if (currentFetchController) currentFetchController.abort();
    currentFetchController = new AbortController();

    fetch(`/user/check-email?email=${encodeURIComponent(val)}`, { 
      signal: currentFetchController.signal 
    })
      .then(res => res.json())
      .then(data => {
        if (data.exists) {
          emailMsg.textContent = '⚠️ Email already exists!';
          emailMsg.style.color = '#dc2626';
          emailInput.style.borderColor = '#dc2626';
        } else {
          emailMsg.textContent = '✓ Email is available';
          emailMsg.style.color = '#16a34a';
          emailInput.style.borderColor = '#16a34a';
        }
      })
      .catch(err => {
        if (err.name !== 'AbortError') {
          console.error('Email check failed:', err);
        }
      });
  });


  emailInput.addEventListener('input', function () {
  // Stop any pending check and clear UI when user starts typing again
  if (currentFetchController) currentFetchController.abort();
  
  emailMsg.textContent = '';
  emailInput.style.borderColor = ''; // Resets to default CSS border
  });
  

  // Password match check
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm_password');

  let passwordMsg = document.createElement('p');
  passwordMsg.style.cssText = 'font-size:12px; margin-top:4px;';
  confirmInput.parentNode.appendChild(passwordMsg);

  confirmInput.addEventListener('input', function () {
    if (!confirmInput.value) {
      passwordMsg.textContent = '';
      confirmInput.style.borderColor = '#f9a8d4';
      return;
    }
    if (passwordInput.value === confirmInput.value) {
      passwordMsg.textContent = '✓ Passwords match';
      passwordMsg.style.color = '#16a34a';
      confirmInput.style.borderColor = '#16a34a';
    } else {
      passwordMsg.textContent = '⚠️ Passwords do not match!';
      passwordMsg.style.color = '#dc2626';
      confirmInput.style.borderColor = '#dc2626';
    }
  });

  passwordInput.addEventListener('input', function () {
    if (confirmInput.value) {
      confirmInput.dispatchEvent(new Event('input'));
    }
  });

  // Block submit
  document.querySelector('form').addEventListener('submit', function (e) {
    if (emailMsg.style.color === 'rgb(220, 38, 38)') {
        e.preventDefault();
        showGirlyAlert('The email address you entered is already registered.');
        return;
    }
    if (usernameMsg.style.color === 'rgb(220, 38, 38)') {
        e.preventDefault();
        showGirlyAlert('The username you entered is already taken.');
        return;
    }
    if (passwordInput.value !== confirmInput.value) {
        e.preventDefault();
        passwordMsg.textContent = '⚠️ Passwords do not match!';
        passwordMsg.style.color = '#dc2626';
        confirmInput.style.borderColor = '#dc2626';
        return;
    }
});

function showGirlyAlert(message) {
    const existing = document.getElementById('girly-alert-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'girly-alert-overlay';
    overlay.style.cssText = `
        position:fixed; inset:0; background:rgba(0,0,0,0.3);
        display:flex; align-items:center; justify-content:center;
        z-index:9999; backdrop-filter:blur(4px);
    `;

    overlay.innerHTML = `
        <div style="
            background: linear-gradient(135deg, #fff0f6, #fce4ec);
            border: 2px solid #f48fb1;
            border-radius: 20px;
            padding: 32px 36px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(236,72,153,0.2);
            animation: popIn 0.3s ease;
        ">
            <div style="font-size:40px; margin-bottom:12px;">🌸</div>
            <h3 style="
                color: #ec4899;
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 10px;
            ">Notice</h3>
            <p style="
                color: #9d174d;
                font-size: 13.5px;
                margin-bottom: 24px;
                line-height: 1.5;
            ">${message}</p>
            <button onclick="document.getElementById('girly-alert-overlay').remove()" style="
                background: linear-gradient(to right, #f472b6, #ec4899);
                color: #fff;
                border: none;
                border-radius: 30px;
                padding: 10px 32px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(236,72,153,0.3);
            ">OK</button>
        </div>
        <style>
            @keyframes popIn {
                from { transform: scale(0.8); opacity: 0; }
                to   { transform: scale(1); opacity: 1; }
            }
        </style>
    `;

    document.body.appendChild(overlay);
}
</script>
{% endblock %}

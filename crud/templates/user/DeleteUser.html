{% extends 'layout/base.html' %}

{% block title %}Delete User{% endblock %}

{% block content %}
{% include 'include/ToastMessage.html' %}

<div style="padding: 60px 40px; display:flex; justify-content:center;">
  <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:40px; max-width:480px; width:100%; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.06);">

    <!-- Icon -->
    <div style="margin-bottom:16px;">
      <svg style="width:52px;height:52px;color:#dc2626;margin:0 auto;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
    </div>

    <h2 style="font-size:18px; font-weight:700; color:#111; margin-bottom:8px;">Delete User</h2>
    <p style="font-size:13px; color:#6b7280; margin-bottom:24px;">
      Are you sure you want to delete <strong>{{ user.full_name }}</strong>? This action cannot be undone.
    </p>

    <form method="POST" action="/user/delete/{{ user.user_id }}">
      {% csrf_token %}
      <div style="display:flex; gap:12px; justify-content:center;">
        <button type="submit"
          style="background:#dc2626; color:#fff; padding:9px 28px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;">
          Yes, Delete
        </button>
        <a href="/user/list"
          style="background:#e5e7eb; color:#374151; padding:9px 28px; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none;">
          Cancel
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
